name: CI/CD - Docker Hub + AWS EC2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: api-escuela

jobs:
  # ---------------------------------------------------------------
  # 1) CI: instalar dependencias, correr pruebas y mostrar cobertura
  # ---------------------------------------------------------------
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Listar archivos de prueba
        run: npx jest --listTests

      - name: Ejecutar pruebas con cobertura (umbral 70%)
        run: npm run test:ci -- --verbose

      - name: Publicar resumen de cobertura
        if: always()
        run: |
          echo "## 📊 Cobertura de código" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx jest --coverage --coverageReporters=text-summary --silent 2>&1 | grep -E "Statements|Branches|Functions|Lines" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------
  # 2) Build & push de la imagen a Docker Hub (solo en push a main)
  # ---------------------------------------------------------------
  build-and-push:
    name: Construir y publicar imagen
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Login en Docker Hub (Personal Access Token)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen (:latest y :sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 3) CD: desplegar en la instancia EC2 por SSH
  # ---------------------------------------------------------------
  deploy-ec2:
    name: Desplegar en AWS EC2
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Descargar primero la imagen nueva (la app vieja sigue arriba mientras tanto)
            docker pull $IMAGE

            # Reemplazar el contenedor anterior
            docker stop api-escuela-container || true
            docker rm api-escuela-container || true
            docker run -d \
              --name api-escuela-container \
              --restart unless-stopped \
              -p 80:3000 \
              $IMAGE

            # Verificar que la nueva versión responde
            for i in $(seq 1 10); do
              if curl -fs http://localhost/api/health > /dev/null; then
                echo "✅ API desplegada correctamente"
                curl -s http://localhost/api/version
                docker image prune -f
                exit 0
              fi
              sleep 3
            done
            echo "❌ La API no respondió después del despliegue"
            docker logs api-escuela-container --tail 50
            exit 1
